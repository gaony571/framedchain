[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framedchain"
version = "0.4.0"
description = "Framed chains: a metric space for protein structures and ensembles of any length"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hyeonsu An"}]
requires-python = ">=3.9"
dependencies = ["numpy", "torch", "scipy"]
keywords = ["framed chains", "protein structure", "structural alignment", "metric", "molecular dynamics", "ensembles", "energy distance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]
ot = ["pot"]
rulers = ["numba"]

[project.urls]
Repository = "https://github.com/gaony571/framedchain"
Issues = "https://github.com/gaony571/framedchain/issues"
Changelog = "https://github.com/gaony571/framedchain/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["framedchain"]
